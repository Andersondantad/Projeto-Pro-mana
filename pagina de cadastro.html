<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
        <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
</head>
<body class="bg-success-subtle p-4">
    <div id="app"></div>
    <script type="module" src="js/main.js"></script>
    <!-- Conteúdo estático legado mantido como fallback para navegadores sem JavaScript. -->
        <!-- 1. Cabeçalho Principal e Navegação Semântica -->
    <header class="topo">
        <nav class="d-flex justify-content-end">
            <a class="nav-link active text-success fw-bold" aria-current="page" href="projeto.html">Início</a>
        </nav>
    </header>
    
    <div style="max-width: 420px; margin: 0 auto;">
        <h2 class="mb-4">Cadastro</h2>
        <form id="cadastroForm" novalidate>

            <div class="mb-3">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" class="form-control" inputmode="numeric" maxlength="15" placeholder="(00) 00000-0000" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" title="Digite o telefone no formato (00) 00000-0000" required>
            </div>

            <div class="mb-3">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" class="form-control" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" title="Digite o CPF no formato 000.000.000-00" required>
            </div>

            <div class="mb-3">
                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep" class="form-control" inputmode="numeric" placeholder="00000-000" maxlength="9" pattern="[0-9]{5}-[0-9]{3}" title="Digite o CEP no formato 00000-000" autocomplete="postal-code" required>
            </div>

            <div id="formFeedback" class="feedback-cadastro d-none" role="status" aria-live="polite"></div>
            <button type="submit" data-bs-toggle="modal" data-bs-target="#exampleModal" class="btn btn-success w-100" id="liveAlertBtn">Enviar dados</button>
        </form>
    </div>
    <div id="liveAlertPlaceholder"></div>
    <script>
        function formatStaticField(field) {
            const digits = field.value.replace(/\D/g, '');
            if (field.name === 'telefone') {
                const value = digits.slice(0, 11);
                const ddd = value.slice(0, 2);
                const number = value.slice(2);
                field.value = ddd.length < 2 ? `(${ddd}` : `(${ddd}) ${number}`.replace(/(\d{5})(\d)/, '$1-$2');
            }
            if (field.name === 'cpf') field.value = digits.slice(0, 11).replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1-$2');
            if (field.name === 'cep') field.value = digits.slice(0, 8).replace(/(\d{5})(\d)/, '$1-$2');
        }

        document.querySelectorAll('input[name="telefone"], input[name="cpf"], input[name="cep"]').forEach(field => {
            field.addEventListener('beforeinput', event => {
                if (event.data && /\D/.test(event.data)) event.preventDefault();
            });
            field.addEventListener('input', () => formatStaticField(field));
        });

        document.querySelector('#cadastroForm').addEventListener('submit', event => {
            event.preventDefault();
            const form = event.currentTarget;
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            
            form.reset();
            const alertPlaceholder = document.getElementById('liveAlertPlaceholder')
            const appendAlert = (message, type) => {
            const wrapper = document.createElement('div')
            wrapper.innerHTML = [
                `<div class="alert alert-${type} alert-dismissible" role="alert">`,
                `   <div>${message}</div>`,
                '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
                '</div>'
            ].join('')

            alertPlaceholder.append(wrapper)
            }

            const alertTrigger = document.getElementById('liveAlertBtn')
            if (alertTrigger) {
            alertTrigger.addEventListener('click', () => {
                appendAlert('Nice, you triggered this alert message!', 'success')
            })
        }
        });
    </script>
</body>
</html>
